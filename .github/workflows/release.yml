name: Legacy SteamOS 1.3 Release

on:
  push:
    tags:
      - 'v1.3'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and LFS asset
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          FULL='release-assets/RPG_Maker_Player_SteamOS_V1.3.tar.gz'
          UPDATE='release-assets/RPG_Maker_Player_SteamOS_Update_V1.3.tar.gz'
          FULL_EXPECTED='582295402c623c0e5d55b009b63154ceaad6e58275e90f42cbf56e2d95083c22'
          UPDATE_EXPECTED='1c7583589ed3880f95c9ab66d730f87b65ff1d0d3e9f6c1ea2fe050325c93ea2'
          test -f "$FULL" -a -f "$UPDATE"
          test "$(sha256sum "$FULL" | awk '{print $1}')" = "$FULL_EXPECTED"
          test "$(sha256sum "$UPDATE" | awk '{print $1}')" = "$UPDATE_EXPECTED"
          echo "Full and OTA SHA-256 verified"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            'release-assets/RPG_Maker_Player_SteamOS_V1.3.tar.gz' \
            'release-assets/RPG_Maker_Player_SteamOS_V1.3.tar.gz.sha256' \
            'release-assets/RPG_Maker_Player_SteamOS_Update_V1.3.tar.gz' \
            'release-assets/RPG_Maker_Player_SteamOS_Update_V1.3.tar.gz.sha256' \
            --title 'RPG Maker Player 1.3' \
            --notes-file 'RELEASE_NOTES_v1.3.md' \
            --verify-tag
