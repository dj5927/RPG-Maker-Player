name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and LFS asset
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify release asset
        shell: bash
        run: |
          set -euo pipefail
          FILE='release-assets/RPG_Maker_Player_SteamOS_WINDOWS_SAFE.tar.gz'
          EXPECTED='a1353da7690df178f7d174b6fb2a58adfb02bcdc6b9396bbd04d300c2397485e'
          test -f "$FILE"
          ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "SHA-256 verified: $ACTUAL"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            'release-assets/RPG_Maker_Player_SteamOS_WINDOWS_SAFE.tar.gz' \
            --title 'RPG Maker Player 1.1' \
            --notes-file 'RELEASE_NOTES_v1.1.md' \
            --verify-tag
